<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#eee}canvas{display:block;width:320px;height:240px}</style></head><body><canvas width="320" height="240"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'); const state=window.fixture={events:[],time:0,pose:0,hp:100}; const start=performance.now();
function frame(now){state.time=(now-start)/1000;state.pose=Math.floor(state.time*5)%4;if(state.time>1.2&&!state.events.length){state.events.push({type:'impact',at:state.time});state.hp=90}ctx.fillStyle='#ddd';ctx.fillRect(0,0,320,240);ctx.fillStyle='#c33';ctx.fillRect(20+Math.sin(state.time*3)*15,80,30,30);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
